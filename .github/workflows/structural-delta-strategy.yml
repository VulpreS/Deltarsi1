name: Structural Delta Strategy
on:
  push:
    paths:
      - structural_delta_strategy.py
      - .github/workflows/structural-delta-strategy.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python structural_delta_strategy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/structural_delta_strategy.json
          git diff --cached --quiet || (git commit -m "Save structural DeltaRSI backtest" && git pull --rebase origin main && git push)
