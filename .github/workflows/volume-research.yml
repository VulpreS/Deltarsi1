name: Volume Research
on:
  push:
    paths:
      - .github/workflows/volume-research.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python cache_volume_once.py
      - run: python volume_ablation.py
      - name: Persist cached volume and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*_4h_volume.csv reports/volume_ablation.json
          git diff --cached --quiet || (git commit -m "Cache 4H volume and evaluate volume filters" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volume-ablation
          path: |
            reports/volume_ablation.json
            data/*_4h_volume.csv
