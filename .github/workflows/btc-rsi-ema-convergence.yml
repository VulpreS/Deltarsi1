name: BTC RSI EMA Convergence Kinetics
on:
  push:
    paths:
      - btc_rsi_ema_convergence_kinetics.py
      - .github/workflows/btc-rsi-ema-convergence.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy scikit-learn
      - run: python btc_rsi_ema_convergence_kinetics.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_rsi_ema_convergence_kinetics.json
          git diff --cached --quiet || (git commit -m "Save RSI EMA convergence kinetics research" && git pull --rebase origin main && git push)
