name: BTC Manual Trade Statistical Audit
on:
  push:
    paths:
      - btc_manual_trade_statistical_audit.py
      - .github/workflows/btc-manual-statistical-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy scikit-learn
      - run: python btc_manual_trade_statistical_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_manual_trade_statistical_audit.json
          git diff --cached --quiet || (git commit -m "Save statistical audit of manual BTC trades" && git pull --rebase origin main && git push)
