name: BTC ETH split 30 30 vs mono 60
on:
  push:
    paths:
      - 'deltarsi_prop_btc_eth_split_vs_mono.py'
      - '.github/workflows/deltarsi-prop-split-vs-mono.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_prop_btc_eth_split_vs_mono.py
      - uses: actions/upload-artifact@v4
        with:
          name: split-vs-mono
          path: reports/deltarsi_prop_btc_eth_split_vs_mono.json
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add reports/deltarsi_prop_btc_eth_split_vs_mono.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: BTC ETH split vs mono results'
          git push origin HEAD:main
