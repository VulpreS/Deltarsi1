name: Temporary redirect check
on:
  push:
    paths:
      - '.github/workflows/temp-link-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect redirects
        shell: bash
        run: |
          python - <<'PY'
          import requests
          u='https://vk.ru/1e40lmcds12412qe2'
          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0'
          try:
              r=s.get(u,allow_redirects=True,timeout=15,stream=True)
              for x in [*r.history,r]:
                  print(x.status_code, x.url, 'Location:', x.headers.get('Location',''))
          except Exception as e:
              print(type(e).__name__,str(e))
          PY
