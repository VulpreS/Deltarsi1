name: Inferred BTC Rules OOS
on:
  push:
    paths:
      - btc_inferred_rules_oos.py
      - .github/workflows/btc-inferred-rules-oos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python btc_inferred_rules_oos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_inferred_rules_oos.json
          git diff --cached --quiet || (git commit -m "Save inferred BTC rule tests" && git pull --rebase origin main && git push)
