name: DeltaRSI price pivot same-sign-window overlap robustness
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/clipped_sign_extreme_robustness.py'
      - '.github/workflows/delta-ml-clipped-price-peak.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipped-peaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore immutable nine market archives without downloading candles again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/delta_ml_3y "$RUNNER_TEMP/archives"
          gh release download delta-ml-3y-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-3y-snapshot-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-icp-zec-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-icp-zec-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-gram-4h-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-gram-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          for archive in "$RUNNER_TEMP"/archives/*.zip; do
            unzip -q "$archive" -d experiments/delta_ml_3y
          done
      - name: Install offline research Python requirements
        run: python -m pip install --quiet numpy pandas xgboost scikit-learn
      - name: Test nonoverlapping within-sign-run high and low windows and BTC alt synchrony
        run: python -u experiments/delta_ml_3y/clipped_sign_extreme_robustness.py
      - name: Upload month-shifted robustness and strict window calendar reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltarsi-clipped-price-high-low-robustness
          path: |
            experiments/delta_ml_3y/CLIPPED_SIGN_EXTREME_ROBUSTNESS.json
            experiments/delta_ml_3y/CLIPPED_SIGN_EXTREME_ROBUSTNESS.md
          retention-days: 90
