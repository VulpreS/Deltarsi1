name: DeltaRSI dynamic exit causality unit tests
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/test_dynamic_exit_causality.py'
      - '.github/workflows/delta-ml-dynamic-causality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy pandas xgboost and sklearn (no historical data needed)
        run: python -m pip install --quiet numpy pandas xgboost scikit-learn
      - name: Verify exit decision sees prior closed score, stop-first and no artificial time-out
        run: python -u experiments/delta_ml_3y/test_dynamic_exit_causality.py
