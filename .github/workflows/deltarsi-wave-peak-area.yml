name: DeltaRSI wave peak vs area study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run wave study on repository candles
        run: python deltarsi_wave_peak_area_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: deltarsi-wave-peak-area
          path: reports/deltarsi_wave_peak_area.json
