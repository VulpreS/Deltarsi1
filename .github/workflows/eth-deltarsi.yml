name: ETH DeltaRSI Research

on:
  workflow_dispatch:
    inputs:
      update_data:
        description: "Download missing candles (off = analyze saved CSV only)"
        type: boolean
        default: false
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch only missing hourly ETH candles
        if: github.event_name == 'schedule' || inputs.update_data == true
        run: python fetch_eth.py
      - name: Analyze DeltaRSI waves
        run: python analyze_delta.py
      - name: Analyze fading and extended horizons
        run: python analyze_extended.py
      - name: Analyze liquidity zones and DeltaRSI synergy
        run: python analyze_liquidity.py
      - name: Analyze multi-wave divergences near liquidity
        run: python analyze_multwave.py
      - name: Commit candles and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ETHUSDT_1h.csv reports/eth_1h.md reports/eth_extended.md reports/eth_liquidity_proxy.md reports/eth_liquidity_zones.csv reports/eth_multwave_liquidity.md
          if ! git diff --cached --quiet; then
            git commit -m "Update ETH 1h candles and DeltaRSI report"
            git push
          fi
