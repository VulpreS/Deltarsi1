name: Hyperliquid Wallet Study

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public wallet fills and multi-timeframe candles
        run: python study_hyperliquid_wallet.py
      - name: Upload separate wallet study data
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-wallet-study
          path: wallet_study/
          retention-days: 30
