name: Five Chart Entry Audit
on:
  push:
    paths:
      - .github/workflows/five-chart-entry-audit.yml
      - five_chart_entry_audit.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python five_chart_entry_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/five_chart_entry_audit.json
          git diff --cached --quiet || (git commit -m "Record five chart timestamp audit" && git pull --rebase origin main && git push)
