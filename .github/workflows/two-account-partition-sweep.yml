name: Exhaustive two account portfolio partition sweep
on:
  push:
    paths:
      - 'experiments/two_account_partition_sweep/**'
      - '.github/workflows/two-account-partition-sweep.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/two_account_partition_sweep/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-account-partition-sweep
          path: experiments/two_account_partition_sweep/results.json
