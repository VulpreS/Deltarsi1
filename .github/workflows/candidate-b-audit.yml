name: Candidate B Semantics Audit
on:
  push:
    paths:
      - test_candidate_b_semantics.py
      - .github/workflows/candidate-b-audit.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_candidate_b_semantics.py
