name: DeltaRSI prop 60pct
on:
  push:
    paths:
      - 'deltarsi_prop_multiasset_60pct.py'
      - '.github/workflows/deltarsi-prop-60pct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_prop_multiasset_60pct.py
      - uses: actions/upload-artifact@v4
        with:
          name: prop-60pct
          path: reports/deltarsi_prop_multiasset_60pct.json
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add reports/deltarsi_prop_multiasset_60pct.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: 60pct prop allocation results'
          git push origin HEAD:main
