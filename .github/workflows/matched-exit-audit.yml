name: Matched Exit Audit
on:
  push:
    paths:
      - 'matched_exit_audit.py'
      - 'funding_timing.py'
      - 'test_matched_exit_audit.py'
      - '.github/workflows/matched-exit-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Matched-cohort regression tests
        run: python -m unittest -v test_matched_exit_audit.py test_p0_execution.py test_completed_candles.py
      - name: Reproducible cached-data audit
        run: python matched_exit_audit.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/matched_exit_audit.json
          git diff --cached --quiet || (git commit -m "Persist matched cohort exit audit" && git pull --rebase origin main && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-exit-audit
          path: reports/matched_exit_audit.json
