name: ICP 1000 SL TP
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_icp_sl_tp_grid_1000.py
      - uses: actions/upload-artifact@v4
        with:
          name: icp-1000
          path: reports/deltarsi_icp_sl_tp_grid_1000.json
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/deltarsi_icp_sl_tp_grid_1000.json
          git commit -m 'ICP 1000 results' || exit 0
          git push
