name: BTC Linear Close and Volume Study
on:
  push:
    paths:
      - btc_linear_close_volume_study.py
      - .github/workflows/btc-linear-close-volume.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy scikit-learn
      - run: python btc_linear_close_volume_study.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_linear_close_volume_study.json
          git diff --cached --quiet || (git commit -m "Save linear close and volume study" && git pull --rebase origin main && git push)
