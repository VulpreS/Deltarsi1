name: DeltaRSI closed 4H risk grid
on:
  push:
    paths:
      - 'deltarsi_closed_risk_grid.py'
      - '.github/workflows/deltarsi-closed-risk-grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_closed_risk_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: deltarsi-closed-risk-grid
          path: reports/deltarsi_closed_risk_grid.json
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add reports/deltarsi_closed_risk_grid.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: closed 4H stop TP BE trail grid'
          git push origin HEAD:main
