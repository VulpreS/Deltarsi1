name: Fade Bright Wick 4H
on:
  push:
    paths:
      - .github/workflows/fade-bright-wick.yml
      - fade_bright_wick_4h.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fade_bright_wick_4h.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fade_bright_wick_4h.json
          git diff --cached --quiet || (git commit -m "Save fade-bright wick 4H results" && git pull --rebase origin main && git push)
