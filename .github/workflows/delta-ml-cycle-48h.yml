name: DeltaRSI 4h cycle durations and 48h time-stop validation
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/cycle_48h_analysis.py'
      - '.github/workflows/delta-ml-cycle-48h.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore all immutable 4h Binance market archives, old TON and new GRAM separately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/delta_ml_3y "$RUNNER_TEMP/archives"
          gh release download delta-ml-3y-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-3y-snapshot-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-icp-zec-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-icp-zec-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-gram-4h-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-gram-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          for archive in "$RUNNER_TEMP"/archives/*.zip; do
            unzip -q "$archive" -d experiments/delta_ml_3y
          done
          for symbol in BTC ETH BNB XRP LINK ICP ZEC TON GRAM; do
            test -s "experiments/delta_ml_3y/data/${symbol}USDT.json" || exit 1
          done
          echo "All nine separate 4H contracts restored; zero market downloads"
      - name: Install Python research libraries
        run: python -m pip install --quiet numpy pandas xgboost scikit-learn
      - name: Analyze indicator cycle lifetimes, price swing times and 48h relative to nearby time caps
        run: python -u experiments/delta_ml_3y/cycle_48h_analysis.py
      - name: Upload full nine-contract distributions, trade outcomes and 48h sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltarsi-cycle-48h-complete
          path: |
            experiments/delta_ml_3y/DELTARSI_CYCLE_48H.json
            experiments/delta_ml_3y/DELTARSI_CYCLE_48H.md
          retention-days: 90
