name: DeltaRSI six assets full history
on:
  workflow_dispatch:
  push:
    paths:
      - 'deltarsi_prop_six_full_history.py'
      - '.github/workflows/deltarsi-six-full-history.yml'
permissions:
  contents: write
jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u download_bnb_zec_1h.py BNBUSDT
      - run: python -u download_bnb_zec_1h.py ZECUSDT
      - run: python -u deltarsi_prop_six_full_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-assets-full-history
          path: reports/deltarsi_prop_six_full_history.json
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/deltarsi_prop_six_full_history.json
          git commit -m 'Update full-history six-asset account results' || exit 0
          git pull --rebase origin main
          git push
