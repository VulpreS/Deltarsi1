name: Maximum strategy grid Pine Codex
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/max_strategy_grid/**'
      - '.github/workflows/max-strategy-grid.yml'
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/max_strategy_grid/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-strategy-grid
          path: experiments/max_strategy_grid/results.json
