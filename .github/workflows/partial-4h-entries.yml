name: Partial 4H Entry Reconstruction
on:
  push:
    paths:
      - .github/workflows/partial-4h-entries.yml
      - five_entries_partial_4h.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python five_entries_partial_4h.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/five_entries_partial_4h.json
          git diff --cached --quiet || (git commit -m "Save partial 4H entry reconstruction" && git pull --rebase origin main && git push)
