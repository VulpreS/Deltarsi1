name: DeltaRSI eight assets - causal regime-conditioned entries and exits
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/regime_eight_assets.py'
      - '.github/workflows/delta-ml-eight-regimes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eight-regimes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore six original historical candles and two newly added ICP/ZEC sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/delta_ml_3y
          mkdir -p "$RUNNER_TEMP/market-cache"
          gh release download delta-ml-3y-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 \
            --pattern delta-ml-3y-snapshot-2026-10-27.zip \
            --dir "$RUNNER_TEMP/market-cache"
          gh release download delta-ml-icp-zec-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 \
            --pattern delta-ml-icp-zec-2026-10-27.zip \
            --dir "$RUNNER_TEMP/market-cache"
          unzip -q "$RUNNER_TEMP/market-cache/delta-ml-3y-snapshot-2026-10-27.zip" \
            -d experiments/delta_ml_3y
          unzip -q "$RUNNER_TEMP/market-cache/delta-ml-icp-zec-2026-10-27.zip" \
            -d experiments/delta_ml_3y
          for coin in BTC ETH BNB XRP LINK TON ICP ZEC; do
            test -s "experiments/delta_ml_3y/data/${coin}USDT.json" || exit 1
          done
          echo "Eight historical datasets ready; no new market download."
      - name: Install numerical research libraries
        run: python -m pip install --quiet numpy pandas scikit-learn xgboost
      - name: Research causal market regimes, shared entries and adaptive exits
        run: python -u experiments/delta_ml_3y/regime_eight_assets.py
      - name: Upload complete eight-coin regime study with OOS, trade log and leave-coin-out transfer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltarsi-eight-coin-regimes
          path: |
            experiments/delta_ml_3y/REGIME_EIGHT_ASSETS_REPORT.json
            experiments/delta_ml_3y/REGIME_EIGHT_ASSETS_REPORT.md
          retention-days: 90
