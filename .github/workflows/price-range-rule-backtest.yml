name: Price Range Rule Backtest
on:
  push:
    paths:
      - price_range_rule_backtest.py
      - .github/workflows/price-range-rule-backtest.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u price_range_rule_backtest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/price_range_rule_backtest.json
          git diff --cached --quiet || (git commit -m "Save price range rule backtest" && git pull --rebase origin main && git push)
