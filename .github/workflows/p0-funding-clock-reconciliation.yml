name: P0 Funding Clock Reconciliation
on:
  push:
    paths:
      - funding_clock_reconciliation.py
      - test_funding_clock_reconciliation.py
      - .github/workflows/p0-funding-clock-reconciliation.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p0-funding-clock-reconciliation
  cancel-in-progress: false
jobs:
  cached-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full integrated regressions and funding decomposition fixtures
        run: python -m unittest -v test_funding_clock_reconciliation test_causal_4h_portfolio test_causal_4h_parity test_completed_candles test_portfolio_open_order test_reverse_open_precedence test_standalone_parity_audit test_portfolio_risk_audit test_funding_timing
      - name: Decompose existing 309 cached historical trades without any exchange API
        run: python -u funding_clock_reconciliation.py
      - name: Persist audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/funding_clock_reconciliation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record P0 matched funding-clock reconciliation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
