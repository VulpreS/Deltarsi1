name: Causal Entry Exit Benchmark
on:
  push:
    paths:
      - causal_entry_exit_benchmark.py
      - .github/workflows/causal-entry-exit-benchmark.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u causal_entry_exit_benchmark.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/causal_entry_exit_benchmark.json
          git diff --cached --quiet || (git commit -m "Save causal entry exit benchmark" && git pull --rebase origin main && git push)
