name: Delta impulse extreme stops and MAE MFE
on:
  push:
    paths:
      - 'experiments/delta_extreme_stops/**'
      - '.github/workflows/delta-extreme-stops.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/delta_extreme_stops/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-extreme-mae-mfe
          path: experiments/delta_extreme_stops/results.json
