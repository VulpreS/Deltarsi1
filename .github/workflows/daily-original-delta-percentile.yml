name: Daily Original DeltaRSI BTC ETH Multiyear Study
on:
  push:
    paths:
      - daily_original_delta_percentile_backtest.py
      - .github/workflows/daily-original-delta-percentile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch futures daily archives and simulate causal DeltaRSI
        run: python daily_original_delta_percentile_backtest.py
      - name: Save data provenance and all daily results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_original_delta_percentile_backtest.json data/BTCUSDT_1d_binance_um.csv data/ETHUSDT_1d_binance_um.csv
          git diff --cached --quiet || (git commit -m "Save multiyear daily DeltaRSI research and exchange OHLC" && git pull --rebase origin main && git push)
