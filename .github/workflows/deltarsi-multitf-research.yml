name: DeltaRSI multi TF adaptive research
on:
  workflow_dispatch:
  push:
    paths:
      - 'deltarsi_multitf_research.py'
      - '.github/workflows/deltarsi-multitf-research.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python
        run: python -m py_compile deltarsi_multitf_research.py
      - name: Prepare candles
        run: |
          set -e
          for tf in 1 4 6 8; do
            for sym in BTCUSDT ETHUSDT ICPUSDT TONUSDT BNBUSDT ZECUSDT; do
              python -u download_delta_6h_8h.py "$tf" "$sym"
            done
          done
      - name: Run research
        run: python -u deltarsi_multitf_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deltarsi-multitf-research
          path: reports/deltarsi_multitf_research.json
      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/deltarsi_multitf_research.json
          git commit -m 'Update multi timeframe research' || exit 0
          git stash push -u -m 'runner candles' || true
          git pull --rebase origin main
          git push
