name: Daily DeltaRSI Percentile Window Sensitivity
on:
  push:
    paths:
      - daily_delta_percentile_window_sensitivity.py
      - .github/workflows/daily-delta-window-sensitivity.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare 10 20 60 day windows
        run: python daily_delta_percentile_window_sensitivity.py
      - name: Commit structured results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_delta_percentile_window_sensitivity.json
          git diff --cached --quiet || (git commit -m "Save daily DeltaRSI strength percentile window sensitivity" && git pull --rebase origin main && git push)
