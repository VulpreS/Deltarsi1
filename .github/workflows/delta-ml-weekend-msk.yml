name: DeltaRSI BTC crypto Moscow Friday-Sunday weekend volatility study
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/weekend_msk_volatility.py'
      - '.github/workflows/delta-ml-weekend-msk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekend-moscow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore archived 4h Binance data; do not download history again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/delta_ml_3y "$RUNNER_TEMP/archives"
          gh release download delta-ml-3y-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-3y-snapshot-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-icp-zec-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-icp-zec-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-gram-4h-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-gram-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          for archive in "$RUNNER_TEMP"/archives/*.zip; do
            unzip -q "$archive" -d experiments/delta_ml_3y
          done
          for symbol in BTC ETH BNB XRP LINK ICP ZEC TON GRAM; do
            test -s "experiments/delta_ml_3y/data/${symbol}USDT.json"
          done
      - name: Install numeric dependencies
        run: python -m pip install --quiet numpy pandas
      - name: Compare complete weeks Friday 03 to Sunday 19 Moscow against weekday baseline
        run: python -u experiments/delta_ml_3y/weekend_msk_volatility.py
      - name: Save full Moscow weekend volatility and regime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltarsi-weekend-msk-volatility-3y
          path: |
            experiments/delta_ml_3y/WEEKEND_MSK_VOLATILITY.json
            experiments/delta_ml_3y/WEEKEND_MSK_VOLATILITY.md
          retention-days: 90
