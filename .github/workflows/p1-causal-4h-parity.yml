name: P1 Causal 4H Parity
on:
  push:
    paths:
      - causal_4h_parity_audit.py
      - test_causal_4h_parity.py
      - .github/workflows/p1-causal-4h-parity.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p1-causal-4h-parity
  cancel-in-progress: false
jobs:
  cached-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest -v test_causal_4h_parity test_completed_candles test_portfolio_open_order test_reverse_open_precedence
      - name: Research (no downloads, no orders)
        run: python -u causal_4h_parity_audit.py
      - name: Save reproducible report (only if source code still current)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/causal_4h_parity_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record cached-only P1 forming 4H parity audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
