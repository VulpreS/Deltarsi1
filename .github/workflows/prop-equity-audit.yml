name: Baseline intrahour equity risk audit
on:
  push:
    paths:
      - 'experiments/prop_equity_audit/**'
      - '.github/workflows/prop-equity-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/prop_equity_audit/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prop-equity-audit
          path: experiments/prop_equity_audit/results.json
