name: Dynamic Exit Research
on:
  push:
    paths:
      - .github/workflows/dynamic-exits.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dynamic_exit_research.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/dynamic_exits.json
          git diff --cached --quiet || (git commit -m "Save dynamic exit research" && git pull --rebase origin main && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-exits
          path: reports/dynamic_exits.json
