name: Codex closed 4H strategy on altcoins
on:
  push:
    paths:
      - 'experiments/codex_alt_comparison/**'
      - '.github/workflows/codex-alt-comparison.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/codex_alt_comparison/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-alt-comparison
          path: experiments/codex_alt_comparison/results.json
