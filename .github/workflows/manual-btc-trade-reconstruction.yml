name: Manual BTC Trade Reconstruction
on:
  push:
    paths:
      - manual_btc_trade_reconstruction.py
      - .github/workflows/manual-btc-trade-reconstruction.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python manual_btc_trade_reconstruction.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/manual_btc_trade_reconstruction.json
          git diff --cached --quiet || (git commit -m "Save manual BTC trade reconstruction" && git pull --rebase origin main && git push)
