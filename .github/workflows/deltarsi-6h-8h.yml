name: DeltaRSI one-year 6H versus 8H
on:
  workflow_dispatch:
  push:
    paths:
      - 'download_delta_6h_8h.py'
      - 'deltarsi_prop_one_year_6h_8h.py'
      - '.github/workflows/deltarsi-6h-8h.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and test each timeframe
        run: |
          set -e
          for tf in 6 8; do
            for sym in BTCUSDT ETHUSDT ICPUSDT TONUSDT BNBUSDT ZECUSDT; do
              python -u download_delta_6h_8h.py "$tf" "$sym"
            done
            python -u deltarsi_prop_one_year_6h_8h.py "$tf"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deltarsi-6h-8h-one-year
          path: reports/deltarsi_prop_one_year_*h.json
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/deltarsi_prop_one_year_6h.json reports/deltarsi_prop_one_year_8h.json
          git commit -m 'Update one-year 6H and 8H results' || exit 0
          git pull --rebase origin main
          git push
