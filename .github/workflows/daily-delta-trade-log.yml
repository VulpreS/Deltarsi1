name: Daily DeltaRSI Detailed Trade Log
on:
  push:
    paths:
      - daily_delta_p20_detailed_trades.py
      - .github/workflows/daily-delta-trade-log.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python daily_delta_p20_detailed_trades.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_delta_p20_detailed_trades.csv reports/daily_delta_p20_detailed_trades_summary.json
          git diff --cached --quiet || (git commit -m "Save daily DeltaRSI per-trade audit trail" && git pull --rebase origin main && git push)
