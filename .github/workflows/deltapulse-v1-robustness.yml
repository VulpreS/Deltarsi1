name: DeltaPulse Daily v1 Robustness
on:
  push:
    paths:
      - deltapulse_daily_v1_robustness.py
      - .github/workflows/deltapulse-v1-robustness.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deltapulse_daily_v1_robustness.py > /tmp/robustness.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/deltapulse_daily_v1_robustness.json
          git diff --cached --quiet || (git commit -m "Save DeltaPulse v1 outlier and fee stress audit" && git pull --rebase origin main && git push)
