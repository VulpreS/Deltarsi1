name: BTC Joint BB MACD Volume OOS
on:
  push:
    paths:
      - btc_joint_bb_macd_volume_oos.py
      - .github/workflows/btc-joint-bb-macd-volume.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy scikit-learn
      - run: python btc_joint_bb_macd_volume_oos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_joint_bb_macd_volume_oos.json
          git diff --cached --quiet || (git commit -m "Save joint BB MACD volume OOS results" && git pull --rebase origin main && git push)
