name: Eight assets compare 5m 15m 4h signal and execution
on:
  push:
    paths:
      - 'experiments/five_min_90d/compare_three_timeframes.py'
      - '.github/workflows/compare-three-timeframes.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run matched multi-timeframe test
        run: python -u experiments/five_min_90d/compare_three_timeframes.py
      - name: Display experiment summary
        if: always()
        run: |
          test -f experiments/five_min_90d/three_tf_results.json && echo "Three-timeframe output complete." >> "$GITHUB_STEP_SUMMARY" || echo "Research failed; inspect traceback." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eight-assets-5m-15m-4h
          path: experiments/five_min_90d/three_tf_results.json
          retention-days: 90
