name: DeltaRSI opposite-sign histogram peaks to price high-low cycles
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/sign_peak_to_price_extreme.py'
      - '.github/workflows/delta-ml-peak-extremes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-peak-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore nine separate contracts from immutable GitHub releases without market downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/delta_ml_3y "$RUNNER_TEMP/archives"
          gh release download delta-ml-3y-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-3y-snapshot-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-icp-zec-cache-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-icp-zec-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          gh release download delta-ml-gram-4h-2026-10-27 \
            --repo VulpreS/Deltarsi1 --pattern delta-ml-gram-2026-10-27.zip \
            --dir "$RUNNER_TEMP/archives"
          for archive in "$RUNNER_TEMP"/archives/*.zip; do
            unzip -q "$archive" -d experiments/delta_ml_3y
          done
          for symbol in BTC ETH BNB XRP LINK ICP ZEC TON GRAM; do
            test -s "experiments/delta_ml_3y/data/${symbol}USDT.json"
          done
      - name: Install numeric research dependencies
        run: python -m pip install --quiet numpy pandas scikit-learn xgboost
      - name: Calculate sign-flip frequency and adjacent blue-high red-low extrema under both Delta definitions
        run: python -u experiments/delta_ml_3y/sign_peak_to_price_extreme.py
      - name: Upload all cycle distributions, 1-4 candle window sensitivity and last ten opposite-peak pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltarsi-sign-peak-high-low-cycles
          path: |
            experiments/delta_ml_3y/SIGN_PEAK_TO_PRICE_EXTREME_REPORT.json
            experiments/delta_ml_3y/SIGN_PEAK_TO_PRICE_EXTREME_REPORT.md
          retention-days: 90
