name: DeltaRSI rule discovery from cached 3y candles
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/research_rules.py'
      - '.github/workflows/delta-ml-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore previously downloaded Binance candles from successful run 41231907011
        uses: actions/download-artifact@v4
        with:
          name: delta-ml-3y-4h-candles
          run-id: 41231907011
          github-token: ${{ github.token }}
          repository: VulpreS/Deltarsi1
          path: experiments/delta_ml_3y
      - name: Verify 6 cached historical files (no new exchange requests)
        run: |
          for coin in BTC ETH TON BNB XRP LINK; do
            test -s "experiments/delta_ml_3y/data/${coin}USDT.json" || exit 1
          done
          ls -lh experiments/delta_ml_3y/data/
      - name: Install numeric research dependencies
        run: python -m pip install --quiet numpy pandas xgboost scikit-learn
      - name: Search closed-candle entry exit rules on historical train and validation only
        run: python -u experiments/delta_ml_3y/research_rules.py
      - name: Upload rule study, ranked candidates and trade ledger
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-ml-rules-study
          path: |
            experiments/delta_ml_3y/rules_report.json
            experiments/delta_ml_3y/rules_trades.json
            experiments/delta_ml_3y/RULE_RESEARCH_REPORT.md
          retention-days: 90
