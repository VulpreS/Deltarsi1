name: P0 Strict 4H Aggregation Audit
on:
  push:
    paths:
      - .github/workflows/p0-strict-aggregation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict aggregation and prior execution regression fixtures
        run: |
          python -m unittest -v test_completed_candles test_p0_execution test_cache_integrity test_matched_exit_audit
          python test_candidate_b_semantics.py
      - name: Frozen historical before-after audit using existing CSV caches only
        run: python aggregation_impact_audit.py
      - name: Persist machine-readable evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/aggregation_impact.json
          git diff --cached --quiet || (git commit -m "P0 strict 4H aggregation impact audit" && git pull --rebase origin main && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-4h-aggregation-audit
          path: reports/aggregation_impact.json
