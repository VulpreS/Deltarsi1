name: Accumulative payout eligibility
on:
  push:
    paths:
      - 'experiments/accumulative_payouts/**'
      - '.github/workflows/accumulative-payouts.yml'
  workflow_dispatch:
jobs:
  payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u experiments/accumulative_payouts/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accumulative-payout-results
          path: experiments/accumulative_payouts/results.json
