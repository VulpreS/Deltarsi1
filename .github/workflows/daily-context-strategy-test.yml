name: Daily Context Strategy Test
on:
  push:
    paths:
      - daily_context_strategy_test.py
      - .github/workflows/daily-context-strategy-test.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python daily_context_strategy_test.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_context_strategy_test.json
          git diff --cached --quiet || (git commit -m "Save daily context strategy backtest" && git pull --rebase origin main && git push)
