name: BTC Traded vs Skipped
on:
  push:
    paths:
      - btc_traded_vs_skipped.py
      - .github/workflows/btc-traded-vs-skipped.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python btc_traded_vs_skipped.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_traded_vs_skipped.json
          git diff --cached --quiet || (git commit -m "Save BTC traded versus skipped research" && git pull --rebase origin main && git push)
