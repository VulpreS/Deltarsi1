name: ICP SL TP grid
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_icp_sl_tp_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: icp-grid
          path: reports/deltarsi_icp_sl_tp_grid.json
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reports/deltarsi_icp_sl_tp_grid.json
          git commit -m 'ICP grid results' || exit 0
          git push
