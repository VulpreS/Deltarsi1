name: DeltaRSI ETH LINK risk and fee stress from cached candles
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/sensitivity.py'
      - '.github/workflows/delta-ml-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore 3-year Binance cache from earlier GitHub Actions artifact
        uses: actions/download-artifact@v4
        with:
          name: delta-ml-3y-4h-candles
          run-id: 41231907011
          github-token: ${{ github.token }}
          repository: VulpreS/Deltarsi1
          path: experiments/delta_ml_3y
      - name: Install libraries
        run: python -m pip install --quiet numpy pandas scikit-learn xgboost
      - name: Compare rules, commission stress and ETH LINK portfolio 4h worst marks
        run: python -u experiments/delta_ml_3y/sensitivity.py
      - name: Save stress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-ml-sensitivity
          path: |
            experiments/delta_ml_3y/sensitivity_report.json
            experiments/delta_ml_3y/SENSITIVITY_REPORT.md
          retention-days: 90
