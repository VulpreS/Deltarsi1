name: Compare DeltaRSI 5m 15m 4h proxy
on:
  push:
    paths:
      - 'research/compare_delta_timeframes.py'
      - '.github/workflows/compare_delta_timeframes.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run research benchmark
        run: python research/compare_delta_timeframes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-timeframe-research
          path: research/results/
