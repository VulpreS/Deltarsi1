name: DeltaRSI Invalidation Experiment
on:
  push:
    paths:
      - deltarsi_invalidation_experiment.py
      - .github/workflows/deltarsi-invalidation-experiment.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deltarsi_invalidation_experiment.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/deltarsi_invalidation_experiment.json
          git diff --cached --quiet || (git commit -m "Save DeltaRSI invalidation comparison" && git pull --rebase origin main && git push)
