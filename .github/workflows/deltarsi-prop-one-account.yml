name: DeltaRSI one continuous account
on:
  push:
    paths:
      - 'deltarsi_prop_one_account_full_history.py'
      - '.github/workflows/deltarsi-prop-one-account.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_prop_one_account_full_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: prop-one-account
          path: reports/deltarsi_prop_one_account_full_history.json
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add reports/deltarsi_prop_one_account_full_history.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: one account continuous backtest'
          git push origin HEAD:main
