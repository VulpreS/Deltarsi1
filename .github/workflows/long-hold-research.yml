name: Long Hold Research
on:
  push:
    paths:
      - .github/workflows/long-hold-research.yml
      - long_hold_research.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python long_hold_research.py
      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/long_hold_research.json
          git diff --cached --quiet || (git commit -m "Save 2-10 day holding research" && (git pull --rebase origin main && git push))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-hold-research
          path: reports/long_hold_research.json

