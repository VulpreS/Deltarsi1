name: BTC Daily Candle Context
on:
  push:
    paths:
      - btc_daily_context_study.py
      - .github/workflows/btc-daily-context.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python btc_daily_context_study.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/btc_daily_context_study.json
          git diff --cached --quiet || (git commit -m "Save BTC daily context comparison" && git pull --rebase origin main && git push)
