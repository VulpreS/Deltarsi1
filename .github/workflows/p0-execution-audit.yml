name: P0 Execution Parity Audit
on:
  push:
    paths:
      - 'execution_core.py'
      - 'feature_walkforward.py'
      - 'research_multiasset.py'
      - 'dynamic_exit_research.py'
      - 'structural_exit_research.py'
      - 'p0_gap_audit.py'
      - 'test_p0_execution.py'
      - '.github/workflows/p0-execution-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: |
          python -m unittest discover -v -p 'test_*.py'
          python test_candidate_b_semantics.py
      - name: Cached historical parity and cost stress
        run: python p0_gap_audit.py
      - name: Persist report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/p0_gap_audit.json
          git diff --cached --quiet || (git commit -m "Persist P0 gap execution audit" && git pull --rebase origin main && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-gap-audit
          path: reports/p0_gap_audit.json
