name: DeltaRSI prop 5000 challenge
on:
  push:
    paths:
      - 'deltarsi_prop_5000_challenge.py'
      - '.github/workflows/deltarsi-prop-5000.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -u deltarsi_prop_5000_challenge.py
      - uses: actions/upload-artifact@v4
        with:
          name: deltarsi-prop-5000
          path: reports/deltarsi_prop_5000_challenge.json
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add reports/deltarsi_prop_5000_challenge.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: prop 5000 challenge replay'
          git push origin HEAD:main
