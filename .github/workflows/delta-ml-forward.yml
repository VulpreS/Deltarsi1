name: DeltaRSI frozen ETH LINK forward + monthly stability (cached)
on:
  push:
    paths:
      - 'experiments/delta_ml_3y/forward_frozen.py'
      - 'experiments/delta_ml_3y/walkforward_diagnostic.py'
      - '.github/workflows/delta-ml-forward.yml'
  workflow_dispatch:
  schedule:
    # Daily 07:15 UTC; future bars downloaded only when daily archives publish.
    - cron: '15 7 * * *'
permissions:
  contents: write
  actions: read
jobs:
  frozen-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore existing 3-year candle cache; never redownload old history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p experiments/delta_ml_3y
          TAG=delta-ml-3y-cache-2026-10-27
          if gh release view "$TAG" --repo VulpreS/Deltarsi1 >/dev/null 2>&1; then
            echo "Restoring persistent GitHub Release snapshot $TAG"
            mkdir -p "$RUNNER_TEMP/delta-ml-snapshot"
            gh release download "$TAG" --repo VulpreS/Deltarsi1 \
              --pattern 'delta-ml-3y-snapshot-2026-10-27.zip' \
              --dir "$RUNNER_TEMP/delta-ml-snapshot"
            unzip -q "$RUNNER_TEMP/delta-ml-snapshot/delta-ml-3y-snapshot-2026-10-27.zip" -d experiments/delta_ml_3y
          else
            echo "Restoring immutable earlier GitHub Actions artifact 41231907011"
            gh run download 41231907011 --repo VulpreS/Deltarsi1 \
              --name delta-ml-3y-4h-candles --dir experiments/delta_ml_3y
          fi
          for coin in BTC ETH TON BNB XRP LINK; do
            test -s "experiments/delta_ml_3y/data/${coin}USDT.json" || exit 1
          done
      - name: Persist 3-year candle archive as GitHub Release beyond artifact expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=delta-ml-3y-cache-2026-10-27
          if gh release view "$TAG" --repo VulpreS/Deltarsi1 >/dev/null 2>&1; then
            echo "Immutable source snapshot already exists; leaving untouched"
          else
            cd experiments/delta_ml_3y
            zip -qr "$RUNNER_TEMP/delta-ml-3y-snapshot-2026-10-27.zip" data
            cd "$GITHUB_WORKSPACE"
            if gh release create "$TAG" "$RUNNER_TEMP/delta-ml-3y-snapshot-2026-10-27.zip" \
              --repo VulpreS/Deltarsi1 \
              --title 'DeltaRSI immutable Binance Vision 4h candles through 2026-10-27' \
              --notes 'Frozen historic 3-year USD-M Binance Vision candle dataset used in DeltaRSI ML research. Baseline only. Public market data, NO credentials. Do not overwrite. Forward starts Nov 1 2026.'; then
              echo "Persistent frozen baseline release created."
            else
              echo "::warning::Could not publish GitHub Release; previous Actions artifact still works until its retention expiry."
            fi
          fi
      - name: Install numerical dependencies
        run: python -m pip install --quiet numpy pandas scikit-learn xgboost
      - name: Run frozen historical monthly bootstrap (NO training or policy selection)
        run: python -u experiments/delta_ml_3y/walkforward_diagnostic.py
      - name: Fetch ONLY new 4h archives after baseline; strict gap check and frozen paper forward
        run: python -u experiments/delta_ml_3y/forward_frozen.py
      - name: Upload frozen forward and monthly diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltarsi-frozen-forward
          path: |
            experiments/delta_ml_3y/FROZEN_FORWARD_REPORT.json
            experiments/delta_ml_3y/FROZEN_FORWARD_REPORT.md
            experiments/delta_ml_3y/WALKFORWARD_DIAGNOSTIC.json
            experiments/delta_ml_3y/WALKFORWARD_DIAGNOSTIC.md
          retention-days: 90
