name: DeltaRSI causal pattern edge search
on:
  push:
    paths:
      - pattern_edge_search.py
      - test_pattern_edge_search.py
      - .github/workflows/pattern-edge-search.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pattern-edge-search
  cancel-in-progress: false
jobs:
  cached-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Causal pattern and candle regression tests
        run: python -m unittest -v test_pattern_edge_search test_causal_4h_parity test_completed_candles
      - name: Research cached DeltaRSI patterns, fixed 15bp costs, no orders
        run: python -u pattern_edge_search.py
      - name: Persist all-grid machine-readable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pattern_edge_search.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exploratory causal pattern grid (all candidates)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
